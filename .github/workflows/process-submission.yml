name: Process & Validate Issue Submissions

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-submission:
    concurrency:
      group: submission-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Only run on submissions
    if: contains(github.event.issue.labels.*.name, 'record-submission') || contains(github.event.issue.labels.*.name, 'gym-submission') || contains(github.event.issue.labels.*.name, 'contest-results') || contains(github.event.issue.labels.*.name, 'calendar-submission') || startsWith(github.event.issue.title, '[Calendar Add]:') || startsWith(github.event.issue.title, '[Calendar Change]:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Acknowledge & Validate Submission
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const body = issue.body || '';

            if (labels.includes('calendar-submission') || /^\[Calendar (Add|Change)\]:/.test(issue.title)) {
              const marker = '<!-- calendar-submission-review -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              if (comments.some(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))) return;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}
              ### Competition Calendar Submission

              Received and queued for maintainer review.

              1. A maintainer will verify the organiser's announcement, date, venue, registration details, and sanctioning status.
              2. For a new event, they will add an entry to \`src/data/competitions.json\`. For a change, they will locate the existing ID in that file or \`src/data/completed_competitions.json\` and update only the requested fields.
              3. The data change will go through a pull request and the repository's validation and build checks before publication.

              Submission does not grant sanctioning or publish a listing automatically. If details change, edit this issue or add a comment with the organiser's updated announcement.`
              });
              return;
            }

            let submissionType = 'Submission';
            if (labels.includes('record-submission')) submissionType = 'Record / Feat Verification';
            if (labels.includes('gym-submission')) submissionType = 'Gym / Training Group Directory Listing';
            if (labels.includes('contest-results')) submissionType = 'Championship / Meet Scorecard';

            const commentBody = `### 🇦🇺 Grip Australia Automated Submission Review

            Thank you for submitting **${submissionType}**!

            - **Status:** Received & Queued for Maintainer Review
            - **Author:** @${issue.user.login}
            - **Next Steps:**
              1. A maintainer will verify submitted details (video lockout / scale verification / facility details).
              2. Once verified, the structured data will be merged into the static data pipeline and published automatically on the next build.

            *Note: To expedite verification, ensure video links are unedited, publicly viewable, and show clear implement lockout.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: commentBody
            });
