name: Validate Data Integrity & Site Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Schema Conformity (records.json, results.json)
        run: npm run validate

      - name: Test Astro Build & Postbuild Indexing
        run: npm run build

      - name: Verify Link Integrity
        run: npm run check:links
