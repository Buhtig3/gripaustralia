[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NO_BASE = "true"

# Cache immutable assets generated by Astro/Vite
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Pagefind client search index
[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fast 301 redirects for consolidated pages
[[redirects]]
  from = "/resources"
  to = "/useful-resources"
  status = 301

[[redirects]]
  from = "/equipment-and-gyms"
  to = "/equipment-guide"
  status = 301
